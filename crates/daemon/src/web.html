<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Windfall Controller</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#0f1b2b; --surface:#172a40; --fg:#e8f3ff; --muted:#8fa9c4; --accent:#8fd3ff; --accent-fg:#08243a; --border:#2a4666; --r:10px; --font:'Segoe UI',system-ui,sans-serif; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--fg); font:14px var(--font); }
body { padding:16px; max-width:520px; margin:0 auto; }
h1 { font-size:15px; font-weight:600; margin:0 0 12px; text-align:center; color:var(--muted); }
.group { background:var(--surface); border-radius:var(--r); margin:12px 0; overflow:hidden; border:1px solid var(--border); }
.row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; border-top:1px solid var(--border); min-height:46px; }
.row:first-child { border-top:0; }
.row small { display:block; color:var(--muted); font-size:12px; }
.seg { display:grid; gap:0; margin:8px 0; border-radius:var(--r); overflow:hidden; border:1px solid var(--border); }
.seg button { background:var(--surface); color:var(--fg); border:0; padding:10px 4px; font:inherit; cursor:pointer; border-right:1px solid var(--border); border-bottom:1px solid var(--border); }
.seg button.on { background:var(--accent); color:var(--accent-fg); font-weight:600; }
.seg button:hover:not(.on) { filter:brightness(1.3); }
input[type=range] { width:200px; accent-color:var(--accent); }
input.hue { appearance:none; height:12px; border-radius:6px; background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
input.hue::-webkit-slider-thumb { appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; border:2px solid #0008; }
.crow { display:flex; align-items:center; gap:10px; }
input[type=color] { width:44px; height:30px; padding:0; }
select,input[type=color] { background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px; font:inherit; }
.switch { position:relative; width:44px; height:24px; flex:none; }
.switch input { opacity:0; width:0; height:0; }
.switch span { position:absolute; inset:0; background:var(--border); border-radius:24px; transition:.15s; cursor:pointer; }
.switch span:before { content:""; position:absolute; height:18px; width:18px; left:3px; top:3px; background:var(--fg); border-radius:50%; transition:.15s; }
.switch input:checked + span { background:var(--accent); }
.switch input:checked + span:before { transform:translateX(20px); background:var(--accent-fg); }
.val { width:34px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
button.clear { display:block; margin:14px auto; background:var(--surface); color:var(--fg); border:1px solid var(--border); border-radius:var(--r); padding:9px 18px; font:inherit; cursor:pointer; }
.hidden { display:none !important; }
.err { color:#ff8f8f; text-align:center; margin:8px 0; }
/* pixel art look */
body.pixel { --r:0; --font:'Press Start 2P','Pixelify Sans','Silkscreen','Cascadia Mono',Consolas,monospace; font-size:12px; font-weight:bold; }
body.pixel .group,body.pixel .seg { border-width:3px; box-shadow:4px 4px 0 var(--border); }
body.pixel .switch span,body.pixel .switch span:before { border-radius:0; }
body.pixel button,body.pixel select,body.pixel input { border-radius:0; }
body.pixel button.clear { border-width:2px; box-shadow:3px 3px 0 var(--border); }
</style>
</head>
<body>
<h1>Windfall Controller</h1>
<div class="err hidden" id="err">Windfall is not answering.</div>
<div class="seg" id="effects" style="grid-template-columns:repeat(4,1fr)"></div>
<div class="seg" id="lightrow" style="grid-template-columns:1fr"><button id="lightbtn">✦  Floating lights  (on top of any mode)</button></div>
<div class="seg" id="renderers" style="grid-template-columns:repeat(2,1fr)"></div>
<div class="group">
  <div class="row"><span>Intensity</span><span><input type="range" id="intensity" min="0" max="100"><span class="val" id="v_intensity"></span></span></div>
  <div class="row"><span>Opacity</span><span><input type="range" id="opacity" min="10" max="100"><span class="val" id="v_opacity"></span></span></div>
  <div class="row"><span>Wind</span><span><input type="range" id="wind" min="-100" max="100"><span class="val" id="v_wind"></span></span></div>
  <div class="row" id="r_element"><span>Flower element<small>What the flowers are made of</small></span><select id="element"></select></div>
  <div class="row" id="r_glow"><span>Glow colour<small>Flowers glow and sparkle in this colour</small></span><input type="color" id="glow_color"></div>
</div>
<div class="group" id="pixelbox">
  <div class="row"><span>Pixel size</span><span><input type="range" id="pixel_size" min="1" max="10"><span class="val" id="v_pixel_size"></span></span></div>
  <div class="row"><span>Colours</span><span><input type="range" id="pixel_levels" min="2" max="16"><span class="val" id="v_pixel_levels"></span></span></div>
</div>
<div class="group hidden" id="colours"></div>
<div class="group" id="toggles"></div>
<button class="clear" id="clear">Clear everything</button>
<script>
const EFFECTS=[["off","Off"],["snow","Snow"],["leaves","Leaves"],["blossom","Blossom"],["rain","Rain"],["flowers","Flowers"],["comets","Comets"],["hearts","Hearts"]];
const ELEMENTS=[["natural","Natural"],["lightning","Lightning"],["fire","Fire"],["ice","Ice"],["matter","Matter"],["void","Void"]];
const RENDERERS=[["smooth","Smooth"],["pixel","Pixel art"]];
const TOGGLES=[["enabled","Display","Show the effect on every monitor; remembered between sessions"],["melt","Melt and wither","Piles slowly disappear on their own"],["ground","Bottom of the screen","Collect on top of the taskbar"],["windows","Windows","Collect on top of windows"],["interact","React to the cursor","Push snow aside, brush flowers"],["over_fullscreen","Over fullscreen","Keep drawing above fullscreen windows"]];
const THEMES={off:["#14171d","#1e222b","#e4e8ef","#8b93a3","#9aa7c0","#10131a","#333a48"],snow:["#0f1b2b","#172a40","#e8f3ff","#8fa9c4","#8fd3ff","#08243a","#2a4666"],leaves:["#24160d","#352012","#fbe9d0","#c09a76","#f0a030","#2a1500","#5a3a22"],blossom:["#2a1420","#3d1f2e","#ffe8f0","#cf9bb0","#ff8fb1","#3a0a1f","#68304a"],rain:["#10161e","#1a232e","#dbe7f3","#7f93a8","#6fa8e8","#06182c","#2c3a4a"],flowers:["#102016","#1a3322","#eafbe8","#8fbf98","#ffd23f","#2b2200","#2f5a3a"],comets:["#0a1024","#131b38","#e6eeff","#8a9bc8","#7fb0ff","#061232","#26335e"],lights:["#1d1408","#2d2010","#fff1d0","#c9a66a","#ffc94a","#2b1d00","#54401e"],hearts:["#240c16","#36131f","#ffe6ee","#d09aac","#ff5f86","#3a0816","#6b2638"]};
const ELEMENT_ACCENT={lightning:"#f5e64a",fire:"#ff7a2a",ice:"#7fdcff",matter:"#d9a441",void:"#b45cff"};
const $=id=>document.getElementById(id);
let state=null, busy=0;
function api(path,body){return fetch(path,{method:body?"POST":"GET",headers:body?{"X-Windfall":"1","Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined}).then(r=>r.json());}
function set(patch){busy=Date.now();return api("/api/set",patch).then(r=>{if(r.state)render(r.state.config)});}
function seg(id,list,key){const el=$(id);el.innerHTML="";list.forEach(([v,t])=>{const b=document.createElement("button");b.textContent=t;b.dataset.v=v;b.onclick=()=>set({[key]:v});el.appendChild(b);});}
seg("effects",EFFECTS,"effect");seg("renderers",RENDERERS,"renderer");
ELEMENTS.forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;$("element").appendChild(o);});
$("element").onchange=e=>set({element:e.target.value});
$("glow_color").onchange=e=>set({glow_color:e.target.value});
TOGGLES.forEach(([k,t,sub])=>{const row=document.createElement("div");row.className="row";row.innerHTML=`<span>${t}<small>${sub}</small></span><label class="switch"><input type="checkbox" id="t_${k}"><span></span></label>`;$("toggles").appendChild(row);row.querySelector("input").onchange=e=>set({[k]:e.target.checked});});
const SL=[["intensity",v=>v/100],["opacity",v=>v/100],["wind",v=>v/100],["pixel_size",v=>+v],["pixel_levels",v=>+v]];
let tmr={};
SL.forEach(([k,f])=>{$(k).oninput=e=>{$("v_"+k).textContent=e.target.value;clearTimeout(tmr[k]);tmr[k]=setTimeout(()=>set({[k]:f(e.target.value)}),60);};});

const COLOURS=[["hearts_color","Heart colour","The hearts and their sparks",c=>c.effect==="hearts"],["comet_color","Shooting star colour","Tails, glow and the sparks where they hit",c=>c.effect==="comets"],["lights_color","Light colour","Used while the effect is Off; with an effect on, the lights take its colours",c=>c.effect==="off"&&c.lights],["flower_color","Flower colour","Every flower is a shade of this",c=>c.effect==="flowers"&&c.element==="natural"&&c.flower_single]];
function hexToHsv(h){const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let hu=0;if(d){if(mx===r)hu=((g-b)/d+6)%6;else if(mx===g)hu=(b-r)/d+2;else hu=(r-g)/d+4;hu*=60;}return[hu,mx?d/mx:0,mx];}
function hsvToHex(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1));};const x=n=>Math.round(f(n)*255).toString(16).padStart(2,"0");return"#"+x(5)+x(3)+x(1);}
COLOURS.forEach(([k,t,sub])=>{const row=document.createElement("div");row.className="row";row.id="c_"+k;row.innerHTML=`<span>${t}<small>${sub}</small></span><span class="crow"><input type="range" class="hue" min="0" max="360"><input type="color"></span>`;$("colours").appendChild(row);const pick=row.querySelector("input[type=color]"),hue=row.querySelector("input.hue");pick.onchange=e=>set({[k]:e.target.value});hue.oninput=()=>{const[h,s,v]=hexToHsv(pick.value);const hex=hsvToHex(+hue.value,Math.max(s,0.35),Math.max(v,0.6));pick.value=hex;clearTimeout(tmr["h"+k]);tmr["h"+k]=setTimeout(()=>set({[k]:hex}),60);};});
const frow=document.createElement("div");frow.className="row";frow.id="c_single";frow.innerHTML='<span>One colour for all flowers<small>Random shapes, one colour you pick</small></span><label class="switch"><input type="checkbox" id="t_flower_single"><span></span></label>';$("colours").prepend(frow);frow.querySelector("input").onchange=e=>set({flower_single:e.target.checked});
$("lightbtn").onclick=()=>set({lights:!(state&&state.lights)});
$("clear").onclick=()=>api("/api/clear",{});
function render(c){
  state=c;
  const th=THEMES[c.effect].slice();let accent=th[4];
  if(c.effect==="flowers"&&ELEMENT_ACCENT[c.element])accent=ELEMENT_ACCENT[c.element];
  const r=document.documentElement.style;
  ["--bg","--surface","--fg","--muted","--accent","--accent-fg","--border"].forEach((n,i)=>r.setProperty(n,n==="--accent"?accent:th[i]));
  document.body.classList.toggle("pixel",c.renderer==="pixel");
  document.querySelectorAll("#effects button").forEach(b=>b.classList.toggle("on",b.dataset.v===c.effect));
  document.querySelectorAll("#renderers button").forEach(b=>b.classList.toggle("on",b.dataset.v===c.renderer));
  $("lightbtn").classList.toggle("on",!!c.lights);
  const put=(k,v,f)=>{const e=$(k);if(document.activeElement!==e){e.value=v;}$("v_"+k).textContent=f?f(v):v;};
  put("intensity",Math.round(c.intensity*100));put("opacity",Math.round(c.opacity*100));put("wind",Math.round(c.wind*100));
  put("pixel_size",c.pixel_size);put("pixel_levels",c.pixel_levels);
  $("pixelbox").classList.toggle("hidden",c.renderer!=="pixel");
  const fl=c.effect==="flowers";$("r_element").classList.toggle("hidden",!fl);$("r_glow").classList.toggle("hidden",!fl);
  $("element").value=c.element;$("glow_color").value=c.glow_color;
  TOGGLES.forEach(([k])=>{$("t_"+k).checked=!!c[k];});
  let any=false;
  COLOURS.forEach(([k,,,show])=>{const row=$("c_"+k);const on=show(c);row.classList.toggle("hidden",!on);any=any||on;const inp=row.querySelector("input[type=color]");if(document.activeElement!==inp)inp.value=c[k];});
  const single=c.effect==="flowers"&&c.element==="natural";$("c_single").classList.toggle("hidden",!single);$("t_flower_single").checked=!!c.flower_single;
  $("colours").classList.toggle("hidden",!(any||single));
}
function poll(){if(Date.now()-busy<800)return;api("/api/state").then(r=>{$("err").classList.add("hidden");if(r.state)render(r.state.config)}).catch(()=>$("err").classList.remove("hidden"));}
poll();setInterval(poll,1500);
</script>
</body>
</html>
