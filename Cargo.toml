[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/ctl", "crates/gui"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
